name: ehealth
description: "eHealth - hospital finder, doctor video consultation and voice-controlled assistant."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  pretty_dio_logger: ^1.4.0

  # Functional error handling
  dartz: ^0.10.1
  equatable: ^2.0.5
  collection: ^1.19.0

  # Location & maps
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Live video call (ZEGOCLOUD)
  zego_uikit_prebuilt_call: ^4.24.3

  # Voice command
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Permissions & device utils
  permission_handler: ^12.0.3
  url_launcher: ^6.3.1

  # Local persistence / env
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  flutter_dotenv: ^5.2.1

  # Auth
  google_sign_in: ^6.2.2

  # File picking & upload (prescription verification)
  file_picker: 10.3.8

  # Prescription file caching & opening
  path_provider: ^2.1.5
  open_filex: ^4.5.0

  # Charts (health progress)
  fl_chart: ^0.69.2

  # In-app payment checkout
  webview_flutter: ^4.10.0

  # Design system fonts (Hanken Grotesk / Inter / JetBrains Mono)
  google_fonts: ^6.2.1

  # DI helpers
  get_it: ^8.0.2

  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - .env
